services:
  mock:
    build:
      context: .
      target: mock
    command: >-
      mock serve --fixture /fixtures/accounts.jsonl
      --backfill-fixture /fixtures/backfill.jsonl --bind 0.0.0.0:3001
    ports:
      - "127.0.0.1:13001:3001"

  tern:
    build: .
    depends_on:
      - mock
    environment:
      RUST_LOG: info
      TERN_DATA_DIR: /data
      TERN_BIND: 0.0.0.0:3000
      TERN_METRICS_BIND: 0.0.0.0:3002
      TERN_JETSTREAM_URL: ws://mock:3001
      TERN_SLINGSHOT_URL: http://mock:3001
      TERN_APPVIEW_URL: http://mock:3001
      TERN_HUBBLE_URL: http://mock:3001
      TERN_BACKFILL: "true"
      TERN_REFRESH_AFTER: "2s"
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:13002:3002"
    volumes:
      - data:/data

volumes:
  data:
