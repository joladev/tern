when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

virtualisation:
  docker: true

environment:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

dependencies:
  - rustup
  - gcc
  - cmake
  - gnumake
  - perl
  - just
  - cargo-nextest

steps:
  - name: unit tests
    command: just test
  - name: integration tests
    command: just test-integration
